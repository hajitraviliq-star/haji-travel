<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فرۆشگاکەم</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--surface:#fff;--text:#1f2937;--muted:#6b7280;--accent:#0f766e;--accent-text:#fff;--line:#e7e2d9;--soft:#e6f4f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111816;--surface:#1b2623;--text:#eef3f1;--muted:#9fb0ab;--accent:#2dd4bf;--accent-text:#06231f;--line:#2b3a36;--soft:#16302b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111816;--surface:#1b2623;--text:#eef3f1;--muted:#9fb0ab;--accent:#2dd4bf;--accent-text:#06231f;--line:#2b3a36;--soft:#16302b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Arabic",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-weight:800;font-size:20px;color:var(--accent)}
.cartbtn{position:relative;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
.badge{background:var(--accent);color:var(--accent-text);border-radius:99px;font-size:12px;padding:1px 8px;margin-inline-start:6px}
.hero{padding:40px 16px;text-align:center;background:var(--soft)}
.hero h1{margin:0 0 8px;font-size:clamp(24px,6vw,38px)}
.hero p{margin:0 0 18px;color:var(--muted)}
.cta{display:inline-block;background:var(--accent);color:var(--accent-text);padding:10px 24px;border-radius:12px;text-decoration:none;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;padding-bottom:8px;margin-bottom:14px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:6px 16px;font:inherit;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px}
.pimg{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px}
.emoji{font-size:52px;line-height:1.2}
.name{font-weight:600}
.price{color:var(--muted);font-size:14px}
.add{margin-top:auto;border:0;background:var(--accent);color:var(--accent-text);border-radius:10px;padding:8px;font:inherit;font-weight:600;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:14px;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}
#ov.show{display:block}
#drawer{position:fixed;inset-inline:0;bottom:0;max-height:80%;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;font:inherit}
.total{display:flex;justify-content:space-between;font-weight:800;padding:14px 0}
.order{width:100%;border:0;background:var(--accent);color:var(--accent-text);border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.msg{margin-top:10px;color:var(--accent);text-align:center}
.close{float:left;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}
#adminPanel{position:fixed;inset-inline:16px;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:12;max-width:520px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:none;max-height:70vh;overflow:auto}
#adminPanel.show{display:block}
.admin-field{display:grid;gap:6px;margin:8px 0}
.admin-field input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit}
.admin-actions{display:flex;gap:8px;margin-top:12px}
.admin-actions button{flex:1;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.admin-save{background:var(--accent);color:var(--accent-text)}
.admin-close{background:var(--bg);color:var(--text);border:1px solid var(--line)!important}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0}
.admin-row button{border:0;background:#dc2626;color:#fff;border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.admin-field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit}.tab{display:flex;align-items:center;gap:8px}.platform-thumb{width:30px;height:30px;object-fit:cover;border-radius:50%}.platform-manage{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.platform-manage input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit}.platform-entry{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:7px 0}.platform-entry img{width:34px;height:34px;object-fit:cover;border-radius:8px}.admin-tabs{display:flex;gap:8px;margin:8px 0 14px}.admin-tab{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px;font:inherit;cursor:pointer}.admin-tab.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}.admin-field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit}.platform-group{display:flex;align-items:center;gap:4px}.platform-link{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--accent);text-decoration:none;font-weight:800}@media(max-width:420px){header{gap:6px;padding:10px}.logo{font-size:15px}.cartbtn{font-size:12px;padding:6px 8px}}</style>
</head>
<body>
<header>
  <div class="logo" id="logo">🛍️ فرۆشگاکەم</div>
  <button class="cartbtn" id="open">سەبەتە<span class="badge" id="count">0</span></button>
</header>
<section class="hero">
  <h1>بەخێربێیت بۆ فرۆشگاکەمان</h1>
  <p>باشترین بەرهەمەکان بە نرخی گونجاو</p>
  <a class="cta" href="#products">بەرهەمەکان ببینە</a>
</section>
<main id="products">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>© فرۆشگاکەم · بۆ داواکردن پەیوەندیمان پێوە بکە</footer>

<div id="adminPanel" aria-label="بەڕێوەبردنی بەرهەم">
  <button class="close" id="adminClose" type="button" aria-label="داخستن">×</button>
  <div id="adminLogin">
    <h3 style="margin:0">چوونەژوورەوەی بەڕێوەبەر</h3>
    <div class="admin-field"><label for="adminEmail">ئیمەیڵ</label><input id="adminEmail" type="email" autocomplete="username"></div>
    <div class="admin-field"><label for="adminPassword">وشەی نهێنی</label><input id="adminPassword" type="password" autocomplete="current-password"></div>
    <div class="admin-actions"><button class="admin-save" id="adminLoginButton" type="button">چوونەژوورەوە</button></div>
    <div class="msg" id="adminAuthMessage"></div>
  </div>
  <div id="adminManager" style="display:none">
    <h3 style="margin:0">بەڕێوەبردنی فرۆشگا</h3>
    <div class="admin-tabs">
      <button class="admin-tab on" type="button" data-admin-section="platforms">پلاتفۆرمەکان</button>
      <button class="admin-tab" type="button" data-admin-section="products">بەرهەمەکان</button>
    </div>
    <section id="adminPlatformsSection">
      <h4 style="margin:0">زیادکردنی پلاتفۆرم</h4>
      <div class="admin-field"><label for="newCategoryName">ناوی پلاتفۆرم / پۆل</label><input id="newCategoryName" type="text"></div>
      <div class="admin-field"><label for="newCategoryImage">وێنەی پلاتفۆرم</label><input id="newCategoryImage" type="file" accept="image/*"></div>
      <div class="admin-field"><label for="newCategoryLink">لینکی پلاتفۆرم</label><input id="newCategoryLink" type="url" placeholder="https://..."></div>
      <div class="admin-actions"><button class="admin-save" id="addCategoryButton" type="button">زیادکردنی پلاتفۆرم</button></div>
      <div id="adminCategoriesList" style="margin-top:12px"></div>
    </section>
    <section id="adminProductsSection" style="display:none">
      <h4 style="margin:0">زیادکردنی بەرهەم</h4>
      <div class="admin-field"><label for="adminName">ناوی بەرهەم</label><input id="adminName" type="text"></div>
      <div class="admin-field"><label for="adminPrice">نرخ (دینار)</label><input id="adminPrice" type="number" min="0"></div>
      <div class="admin-field"><label for="adminCategory">پلاتفۆرم / پۆل</label><select id="adminCategory"></select></div>
      <div class="admin-field"><label for="adminImage">وێنەی بەرهەم</label><input id="adminImage" type="file" accept="image/*"></div>
      <div class="admin-actions"><button class="admin-save" id="adminSave" type="button">زیادکردنی بەرهەم</button><button class="admin-close" id="adminLogout" type="button">چوونەدەرەوە</button></div>
      <div id="adminList" style="margin-top:12px"></div>
    </section>
  </div>
</div>
<div id="ov"><div id="drawer">
  <button class="close" id="close" aria-label="داخستن">×</button>
  <h3 style="margin:0 0 6px">سەبەتەکەم</h3>
  <div id="items"></div>
  <div class="total"><span>کۆی گشتی</span><span id="sum">0</span></div>
  <button class="order" id="order">داواکردن بە واتسئەپ</button>
  <div class="msg" id="msg"></div>
</div></div>

async function loadProducts(){var results=await Promise.all([supabaseClient.from("products").select("id,n,e,p,c,img").order("created_at",{ascending:false}),supabaseClient.from("categories").select("id,name,img,link").order("created_at",{ascending:true})]);if(results[0].error||results[1].error){var err=results[0].error||results[1].error;console.error(err);alert("نەتوانرا بەرهەم و پلاتفۆرمەکان باربکرێن. دڵنیابە SQL ـەکانی Supabase جێبەجێ کراون.");return}P=(results[0].data||[]).map(function(x){x.p=Number(x.p);return x});categoriesData=results[1].data||[];cart={};refreshProducts()}function updateAdminView(){

async function removeProduct(index){
  var product=P[index];if(!product)return;
  if(!confirm("ئەم بەرهەمە بسڕیتەوە؟"))return;
  var result=await supabaseClient.from("products").delete().eq("id",product.id);

}
